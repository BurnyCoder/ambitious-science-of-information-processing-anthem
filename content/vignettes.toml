# The illustration track: one figure card per idea, timed to the sung word it illustrates.
# Local: each [[vignette]] is one card:
#   id       component in video/src/vignettes/index.ts ("formula" = generic title + text card)
#   section  same keys as scenes.toml: "<kind> <occurrence>" or "<kind>" (every occurrence)
#   trigger  regex searched in each sung word's normalized key (lowercase letters/digits only); the first mention
#   nth      which matching word of the section (1-based, backing echoes count too); default 1
#   lane     "a" or "b": panel slot 0 or 1 of the card's scene (stage/layout.json); cards sharing a lane never
#            overlap (the earlier one is trimmed). "scene": the scene draws the card itself, in place (no slot, no trim)
#   hold     seconds on screen (default 6), always clipped at the section's end (no spill over the next scene)
#   badge    where the content comes from: released data | published numbers | live math | from the paper | schematic
# [[clear]] (section, trigger, nth): every earlier card of that section leaves just before the cue word (a highlight).
# Global: read by anthem.vignettes (placed in timeline.json); panels are drawn by video/src/stage/ in their scene's
#   slots, wired to the object they explain; docs/vignettes.md lists the sources, reports/exp07 checks every on-screen
#   number, reports/exp09 logs the v1.5.0 curation (which cards became scene-drawn, merged or dropped, and why).

# Two panels per scene at most, so every panel stays on screen for its whole time (>= 3 s, tested).
lanes = ["a", "b"]

