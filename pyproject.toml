[project]
name = "anthem"
version = "0.1.0"
description = "Suno-generated anthem + code-animated Remotion music video about ambitious interpretability and a science of deep learning"
readme = "README.md"
authors = [
    { name = "BurnyCoder", email = "happymancz@email.cz" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "librosa>=1.0.0",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
]

[project.scripts]
anthem = "anthem:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
analysis = [
    "demucs>=4.0.1",
    "faster-whisper>=1.2.1",
    "matplotlib>=3.11.2",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]  # experiment helpers in scripts/analysis/ are importable in tests (https://docs.pytest.org/en/stable/reference/reference.html#confval-pythonpath)
